# ============================================================================
# Platform API: WorkloadCluster, the productized version of the act-1 definition
#
# Four-layer design (same shape as the API of our real private cloud):
#   1. Minimal top level: version / nodes / profile, all with defaults
#   2. Optional advanced: CIDRs, kubelet args; only people who tune them need to know
#   3. Object pass-through: kubeletExtraArgs is forwarded verbatim (whole block replaced at the anchor)
#   4. Locked down: certSANs, hostpath-provisioner and friends are fixed in the template;
#      fields the schema does not declare are rejected at apply time
#
# Object references use the v1beta2 apiVersion on purpose: Cluster API v1.13 stores v1beta2 and
# rewrites ref apiVersions on read-back, so a v1beta1 ref makes kro see the resource as mutated
# (instance READY stays False). The resources themselves stay on the v1beta1 kinds.
# ============================================================================
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: workloadcluster
spec:
  schema:
    apiVersion: v1alpha1
    kind: WorkloadCluster
    spec:
      version: string | default="v1.34.0"
      nodes: integer | default=1 minimum=0 maximum=3
      profile: string | default="single-node" enum="single-node,ha"
      advanced:
        podCIDR: string | default="10.244.0.0/16"
        serviceCIDR: string | default="10.128.0.0/12"
        kubeletExtraArgs: object | default={}
    status:
      controlPlaneReady: ${kcp.status.initialized}
  resources:
    - id: cluster
      template:
        apiVersion: cluster.x-k8s.io/v1beta1
        kind: Cluster
        metadata:
          name: ${schema.metadata.name}
          namespace: default
        spec:
          clusterNetwork:
            pods:
              cidrBlocks: ["${schema.spec.advanced.podCIDR}"]
            services:
              cidrBlocks: ["${schema.spec.advanced.serviceCIDR}"]
          infrastructureRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: DockerCluster
            name: ${schema.metadata.name}
            namespace: default
          controlPlaneRef:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlane
            name: ${schema.metadata.name}-control-plane
            namespace: default
    - id: dockercluster
      template:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: DockerCluster
        metadata:
          name: ${schema.metadata.name}
          namespace: default
        spec: {}
    - id: cpTemplate
      template:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: DockerMachineTemplate
        metadata:
          name: ${schema.metadata.name}-control-plane
          namespace: default
        spec:
          template:
            spec:
              customImage: kindest/node:v1.34.0                    # locked: platform-chosen node image
              extraMounts:
                - containerPath: /var/run/docker.sock
                  hostPath: /var/run/docker.sock
    - id: kcp
      template:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta1
        kind: KubeadmControlPlane
        metadata:
          name: ${schema.metadata.name}-control-plane
          namespace: default
        spec:
          # profile: ha -> 3 control-plane nodes, single-node -> 1
          replicas: '${schema.spec.profile == "ha" ? 3 : 1}'
          machineTemplate:
            infrastructureRef:
              apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
              kind: DockerMachineTemplate
              name: ${schema.metadata.name}-control-plane
              namespace: default
          kubeadmConfigSpec:
            clusterConfiguration:
              apiServer:
                certSANs: [localhost, 127.0.0.1, 0.0.0.0, host.docker.internal]   # locked
              controllerManager:
                extraArgs:
                  enable-hostpath-provisioner: "true"                              # locked
            initConfiguration:
              nodeRegistration:
                ignorePreflightErrors: [ImagePull]                                 # locked: offline environment
                kubeletExtraArgs: ${schema.spec.advanced.kubeletExtraArgs}         # pass-through
            joinConfiguration:
              nodeRegistration:
                ignorePreflightErrors: [ImagePull]
                kubeletExtraArgs: ${schema.spec.advanced.kubeletExtraArgs}
          version: ${schema.spec.version}
    - id: mdTemplate
      template:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: DockerMachineTemplate
        metadata:
          name: ${schema.metadata.name}-md-0
          namespace: default
        spec:
          template:
            spec:
              customImage: kindest/node:v1.34.0                    # locked
    - id: bootstrapTemplate
      template:
        apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
        kind: KubeadmConfigTemplate
        metadata:
          name: ${schema.metadata.name}-md-0
          namespace: default
        spec:
          template:
            spec:
              joinConfiguration:
                nodeRegistration:
                  ignorePreflightErrors: [ImagePull]
                  kubeletExtraArgs: ${schema.spec.advanced.kubeletExtraArgs}
    - id: md
      template:
        apiVersion: cluster.x-k8s.io/v1beta1
        kind: MachineDeployment
        metadata:
          name: ${schema.metadata.name}-md-0
          namespace: default
        spec:
          clusterName: ${schema.metadata.name}
          replicas: ${schema.spec.nodes}
          selector:
            matchLabels:
          template:
            spec:
              clusterName: ${schema.metadata.name}
              version: ${schema.spec.version}
              bootstrap:
                configRef:
                  apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
                  kind: KubeadmConfigTemplate
                  name: ${schema.metadata.name}-md-0
                  namespace: default
              infrastructureRef:
                apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
                kind: DockerMachineTemplate
                name: ${schema.metadata.name}-md-0
                namespace: default

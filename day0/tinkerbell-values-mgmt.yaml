# Tinkerbell values for the management cluster (day-0 step 9: pivot to self-hosting)
# Differences from the seed values:
# - VIPs temporarily .6/.7 (the seed still owns .3/.4; switch with helm upgrade at handover)
# - sourceInterface=eth0 (NIC name on Flatcar nodes)
# - hookos artifacts under /opt/hook (Flatcar's /tmp is tmpfs and is lost on reboot)
publicIP: 172.16.91.6
trustedProxies: ["10.44.0.0/16"]   # management cluster pod CIDR
artifactsFileServer: http://172.16.91.7:7173

deployment:
  init:
    sourceInterface: eth0
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 500m
      memory: 256Mi
  envs:
    smee:
      dhcpMode: auto-proxy
    tinkServer:
      autoDiscoveryEnabled: true
      autoDiscoveryNamespace: tinkerbell
      autoEnrollmentEnabled: false   # keep auto-enrollment off on mgmt until handover is complete

optional:
  kubevip:
    interface: eth0
  osie:
    service:
      loadBalancerIP: "172.16.91.7"
  hookos:
    arch: x86_64
    kernelVersion: "6.6"
    extension: tar.gz
    persistence:
      localPersistentVolume:
        path: /opt/hook

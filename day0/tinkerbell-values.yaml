# Tinkerbell values (day-0 step 2)
# Assumptions: provisioning network 172.16.91.0/24, second NIC ens19 on that network,
# the existing DHCP server keeps handing out IPs (Tinkerbell only adds boot info)

publicIP: 172.16.91.3                       # Tinkerbell itself (DHCP replies / TFTP / HTTP / gRPC)
trustedProxies: ["10.42.0.0/16"]            # k3s default pod CIDR
artifactsFileServer: http://172.16.91.4:7173

deployment:
  init:
    sourceInterface: ens19                  # required: NIC that receives PXE broadcasts (default picks the uplink NIC)
  resources:
    limits:
      cpu: 500m
      memory: 512Mi                         # default 128Mi gets OOM-killed repeatedly (observed)
    requests:
      cpu: 500m
      memory: 256Mi
  envs:
    smee:
      # auto-proxy: registered hosts get reservations; unknown hosts get IPs from the site DHCP and smee only adds boot info
      dhcpMode: auto-proxy
    tinkServer:
      autoDiscoveryEnabled: true            # unknown host -> Hardware created automatically
      autoDiscoveryNamespace: tinkerbell
      autoEnrollmentEnabled: true           # rule matched -> install triggered automatically

optional:
  kubevip:
    interface: ens19
  osie:
    service:
      loadBalancerIP: "172.16.91.4"         # file server for HookOS and OS images
  hookos:
    arch: x86_64
    kernelVersion: "6.6"
    extension: tar.gz

# Tinkerbell 安裝設定（day-0 建置第 2 步）
# 環境假設：裝機網段 172.16.91.0/24、本機第二張網卡 ens19 接在該網段、
# 機房既有 DHCP 照常發 IP（Tinkerbell 只補答開機資訊，不搶位）

publicIP: 172.16.91.3                       # Tinkerbell 本體（DHCP 應答/TFTP/HTTP/gRPC）
trustedProxies: ["10.42.0.0/16"]            # k3s 預設 pod 網段
artifactsFileServer: http://172.16.91.4:7173

deployment:
  init:
    sourceInterface: ens19                  # 必填：收 PXE 廣播的網卡（預設會抓錯到出網卡）
  resources:
    limits:
      cpu: 500m
      memory: 512Mi                         # 預設 128Mi 會被 OOM 反覆重啟（實測）
    requests:
      cpu: 500m
      memory: 256Mi
  envs:
    smee:
      # auto-proxy：已登記的機器走保留行為；未知機器 IP 由機房 DHCP 發、smee 只補開機資訊
      dhcpMode: auto-proxy
    tinkServer:
      autoDiscoveryEnabled: true            # 未知機器 → 自動建立 Hardware
      autoDiscoveryNamespace: tinkerbell
      autoEnrollmentEnabled: true           # 符合規則 → 自動觸發安裝

optional:
  kubevip:
    interface: ens19
  osie:
    service:
      loadBalancerIP: "172.16.91.4"         # HookOS 與 OS 映像的檔案伺服器
  hookos:
    arch: x86_64
    kernelVersion: "6.6"
    extension: tar.gz

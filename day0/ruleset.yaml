# day-0 step 5: enrollment rule (WorkflowRuleSet)
# A new machine's agent reports hardware attributes -> rule matches -> tink-server creates a Workflow
# This one is match-all (any MAC); production can narrow it, e.g. a single chassis vendor:
# {"chassis": {"vendor": ["QEMU"]}}
apiVersion: tinkerbell.org/v1alpha1
kind: WorkflowRuleSet
metadata:
  name: enroll-flatcar-all
  namespace: tinkerbell
spec:
  rules:
    - '{"networkInterfaces": {"mac": [{"wildcard": "*"}]}}'
  workflow:
    addAttributes: true
    disabled: false
    namespace: tinkerbell
    template:
      agentValue: worker_id
      ref: flatcar-install

name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['slides/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slides/package-lock.json
      - run: npm ci
        working-directory: slides
      - run: npm run build
        working-directory: slides
        env:
          SLIDES_BASE: /k8s-summit-2026-workshop/
      # SPA fallback: GitHub Pages serves 404.html for unknown paths
      - run: cp dist/index.html dist/404.html
        working-directory: slides
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
